# FRAM — Projet Xcode jetable (généré par xcodegen) pour compiler réellement les
# fichiers skills/*/tests/ios-tests.swift dans un vrai target UI Testing.
#
# `swiftc -typecheck` seul (utilisé pour vérifier patterns.swift) ne résout pas
# `import XCTest` / `XCUIApplication` / `XCUIElement` : ces symboles n'existent que
# dans le contexte d'un target de test Xcode réel. Ce projet pointe directement sur
# les vrais fichiers du repo (aucune copie) — voir la section `sources` de chaque
# target *UITests ci-dessous.
#
# Un target par skill (plutôt qu'un seul target avec les 12 fichiers) : chaque
# fichier s'appelle littéralement `ios-tests.swift` dans son dossier skill, et le
# compilateur Swift refuse deux fichiers de même nom dans un même module (il s'en
# sert pour désambiguïser les déclarations `private`). Contrairement à Kotlin, pas
# de contournement côté module unique sans renommer les fichiers.
#
# Usage :
#   xcodegen generate
#   xcodebuild build-for-testing -project FRAMiOSContentCheck.xcodeproj \
#     -scheme HostApp -destination 'generic/platform=iOS Simulator'

name: FRAMiOSContentCheck

options:
  bundleIdPrefix: com.fram.verify
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGNING_ALLOWED: NO
  GENERATE_INFOPLIST_FILE: YES

targets:
  HostApp:
    type: application
    platform: iOS
    sources:
      - path: HostApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fram.verify.host

  SKILL01UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../../skills/SKILL-01-elements-graphiques/tests/ios-tests.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fram.verify.uitests.skill01
    dependencies:
      - target: HostApp

