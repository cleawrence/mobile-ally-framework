# FRAM — Build du site de documentation MkDocs
# Valide que docs/ + mkdocs.yml produisent un site sans erreur à chaque changement.

name: Docs — Build MkDocs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "📚 mkdocs build --strict"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer MkDocs Material
        run: pip install mkdocs-material mkdocs-minify-plugin

      - name: Build strict (échoue sur tout warning)
        run: mkdocs build --strict

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Valider les diagrammes Mermaid
        # mkdocs build --strict ne détecte pas les diagrammes Mermaid cassés :
        # le rendu se fait côté client dans le navigateur, pas au build. Fait
        # tourner chaque diagramme dans le vrai moteur mermaid.js (Chromium
        # headless) pour attraper les erreurs qu'un visiteur verrait.
        run: python3 linting/ci/check-mermaid.py
